<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Input Undangan Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8 font-sans">
    <div class="max-w-xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-slate-200">
        <div class="mb-6 border-b pb-4">
            <h2 class="text-2xl font-bold text-slate-800">Tambah Undangan Klien</h2>
            <p class="text-xs text-slate-500 mt-1">Input data klien untuk membuat link undangan otomatis.</p>
        </div>
        
        <form id="formUndangan" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">URL Custom / Slug (Harus Unik)</label>
                <input type="text" id="slug" placeholder="contoh: romeo-juliet" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Mempelai Pria</label>
                    <input type="text" id="mempelai_pria" placeholder="Romeo" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Mempelai Wanita</label>
                    <input type="text" id="mempelai_wanita" placeholder="Juliet" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Tanggal Acara</label>
                    <input type="date" id="tanggal_acara" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Waktu Acara</label>
                    <input type="text" id="waktu_acara" placeholder="09:00 - Selesai" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Alamat Lokasi</label>
                <textarea id="lokasi" placeholder="Gedung / Rumah, Jl. Contoh No. 123" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" rows="2"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Link Google Maps</label>
                <input type="url" id="link_maps" placeholder="https://maps.google.com/..." class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Info Amplop Digital / Rekening</label>
                <input type="text" id="rekening" placeholder="BCA 12345678 a.n. Romeo" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">Generate Link Undangan</button>
        </form>

        <div id="hasil" class="mt-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl hidden">
            <p class="text-emerald-800 font-bold text-sm">Undangan Berhasil Dibuat!</p>
            <p class="text-xs text-slate-600 mt-1">Salin & Bagikan Link Ini ke Klien:</p>
            <div class="mt-2 p-2 bg-white border rounded text-xs break-all font-mono">
                <a id="linkUndangan" href="#" target="_blank" class="text-blue-600 underline"></a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://fvbicfmbvwwrmrggofna.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2YmljZm1idnd3cm1yZ2dvZm5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwOTc2MzEsImV4cCI6MjEwNDY3MzYzMX0.Z9nTVPj2cvxw3XFDTjqtRDhPjEupac8tnbhYoaj_2oQ";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('formUndangan').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            const slugVal = document.getElementById('slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
            
            const payload = {
                slug: slugVal,
                mempelai_pria: document.getElementById('mempelai_pria').value,
                mempelai_wanita: document.getElementById('mempelai_wanita').value,
                tanggal_acara: document.getElementById('tanggal_acara').value,
                waktu_acara: document.getElementById('waktu_acara').value,
                lokasi: document.getElementById('lokasi').value,
                link_maps: document.getElementById('link_maps').value,
                rekening: document.getElementById('rekening').value
            };

            const { error } = await db.from('undangan').insert([payload]);

            if (error) {
                alert('Gagal menyimpan (mungkin slug sudah pernah dipakai): ' + error.message);
            } else {
                const currentFolder = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
                const generatedLink = `${currentFolder}/undangan.html?to=${slugVal}`;
                
                document.getElementById('linkUndangan').href = generatedLink;
                document.getElementById('linkUndangan').innerText = generatedLink;
                document.getElementById('hasil').classList.remove('hidden');
                document.getElementById('formUndangan').reset();
            }

            btn.innerText = "Generate Link Undangan";
            btn.disabled = false;
        });
    </script>
</body>
</html>
